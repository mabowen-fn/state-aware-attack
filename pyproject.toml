[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "state-aware-ra"
version = "0.1.0"
description = "Fixed-script trajectory evaluation harness for RA/STAR-inspired LLM safety research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.75.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.6.0"]
research = ["torch>=2.4", "transformers>=4.45", "accelerate>=1.0", "safetensors>=0.4", "numpy>=1.26", "scikit-learn>=1.5"]

[project.scripts]
stateaware = "stateaware.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stateaware"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
